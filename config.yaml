# ---------------------------------------------------------------------------
# llm-monitor configuration
#
# Paths are resolved relative to THIS file's directory.
# Every key can be overridden with MONITOR_<SECTION>_<KEY> env vars, e.g.
#   MONITOR_SERVER_UI_PORT=9010  MONITOR_SERVER_GATEWAY_PORT=8010
# ---------------------------------------------------------------------------

paths:
  # run_llm.sh 已淘汰：启动命令由 monitor/launcher.py 依据 engines/*.yaml 原生构建。
  run_dir: "../run"            # pid files + engine logs
  state_dir: "./state"         # monitor's own sqlite db / start logs

server:
  # Control plane: REST + WebSocket + the web UI.
  ui_host: "0.0.0.0"
  ui_port: 9000
  # Data plane: the OpenAI-compatible gateway every client talks to.
  gateway_host: "0.0.0.0"
  gateway_port: 8000
  # The engine binds here (loopback only, so nobody can bypass the tap).
  engine_port: 8001
  # Optional shared secret for the control API ("" = no auth, trusted LAN only).
  auth_token: ""

engine:
  default: "vllm"
  # 启动时默认 profile（UI 预选 + 不指定 profile 时使用）。
  default_profile:
    vllm: "mtp"
    ninfer: "stage1"
  # Where the engine binds. Loopback keeps every request on the data path
  # (nobody can bypass the tap). Set 0.0.0.0 only as an operational escape hatch.
  bind_host: "127.0.0.1"
  container_names:
    vllm: "vllm-qwen38"
    ninfer: "ninfer-qwen38"
  profiles: ["stage1", "mtp", "dflash", "dflash2", "kv2", "kv3"]
  # 启动时默认上下文（不指定 ctx 时用）。vllm 256k = 262,144 tok = 模型硬上限
  # (max_position_embeddings)。注意：GPU KV 池约 272,954 tok，256k 时并发只有
  # ~1.04x —— 长上下文与并发不可兼得，需要并发请在引擎页把 ctx 调小。
  default_ctx:
    vllm: "256k"
    ninfer: "256k"
  stop_grace_s: 25
  health_timeout_s: 1800
  health_poll_s: 2.0
  # Start NInfer with the full-precision JSONL request log.
  # It is trimmed by the `logs` section below (NInfer itself never rotates it).
  ninfer_jsonl: true
  ninfer_jsonl_path: "../run/ninfer-requests.jsonl"
  ninfer_stats_interval_ms: 1000
  # Extra engine env (e.g. API_KEY, GPU_MEM_UTIL); the launcher reads the same
  # variable names from this mapping.
  extra_env: {}

gateway:
  # Inject `stream_options.include_usage` into streaming chat requests so every
  # stream ends with exact usage. Some naive clients crash on the extra chunk
  # with `choices: []`; leave false if you have such a client.
  force_usage_chunk: false
  # Hard cap for buffering a request/response body for the tap (bytes).
  max_capture_bytes: 8388608
  # Upstream connect timeout (seconds); generation itself is never timed out.
  connect_timeout_s: 10

collect:
  metrics_interval_s: 2.0
  gpu_interval_s: 1.0
  runtime_interval_s: 3.0
  # Window used to turn engine counters into tok/s.
  rate_window_s: 10.0

# ---------------------------------------------------------------------------
# KV cache 三级 offload（GPU 显存 → CPU 内存 → 磁盘）
#
# monitor 在启动 vLLM 时把这里的值转成 --kv-transfer-config，作为与 profile
# 正交的一层追加，因此 mtp / dflash 等 profile 都能叠加。enabled=false 时
# 引擎回到纯显存 KV（与旧行为一致）。
# ---------------------------------------------------------------------------
kvcache:
  enabled: true                 # 总开关；也决定引擎启动时是否带 offload 参数
  cpu_bytes_to_use: "12G"       # 第 2 级（CPU 主层）预算；12G = 12 GiB
  disk_dir: "/mnt/kvcache/kvoffload"   # 第 3 级磁盘层根目录（宿主机路径）
  # 磁盘层上限（GiB）。默认 64：
  #   - 约占 98 GiB 分区的 2/3，留 ~34 GiB 余量，杜绝 ENOSPC（写满曾让 150k
  #     prefill 从 65s 劣化到 268s，见 4a170e3）
  #   - 约等于 12 个 128k 前缀（每个 ≈5.2 GB KV），或 ~24 个 64k 前缀
  #   - 回收在 90% 水位触发，稳态占用 ≈57.6 GiB
  # 0 = 不设上限，但仍会自动保留 capacity×5%（≥2 GiB）；
  # 显式值也不会超过「分区容量 − 保留区」，避免手滑写大。
  disk_limit_gb: 64
  eviction_policy: "arc"        # CPU 主层驱逐策略：lru / arc
  # 容量与 IO 采集频率（低频即可，磁盘遍历有成本）
  collect_interval_s: 30
  # NVMe SMART 健康采集频率（低频）
  health_interval_s: 120
  device: ""                    # 健康检查设备；空 = 自动探测 disk_dir 所在物理盘

storage:
  db: "./state/monitor.db"
  # In-memory time-series ring (1 sample/s).
  ring_seconds: 7200
  # Prompt/response TEXT is kept only for the newest N requests (0 = keep none).
  text_keep: 200
  # Per-request text cap (bytes) for the tap.
  text_cap_bytes: 2097152
  # Metadata retention.
  retention_days: 30
  # Hard size cap on the sqlite file (MB, 0 = no cap). retention_days already
  # bounds the age of a row; this bounds the size if the request rate is high
  # enough to out-grow the disk inside that window. Oldest rows go first and
  # the freed pages are handed back with incremental_vacuum (no 2x VACUUM).
  max_db_mb: 512

# Keeps every log this program writes from growing without a bound.
# Logs are trimmed in place (keep the tail, drop the head), never renamed:
# the engine holds an O_APPEND fd and must keep writing into the same inode.
logs:
  max_log_mb: 64          # run/<engine>.log (engine stdout) + run/monitor.log
  keep_tail_mb: 8         # how much of the tail survives a trim
  lifecycle_max_mb: 8     # state/lifecycle.log (docker start/stop transcripts)
  jsonl_max_mb: 64        # NInfer --request-log-jsonl file
  check_interval_s: 30    # how often the maintenance loop looks

# 金额换算（只读展示，不影响任何采集）。
# DeepSeek 官方 2026-09-10 价目表，人民币 / 百万 token，以下是「高峰价」：
#   输入·缓存命中 0.04 元   输入·缓存未命中 2.00 元   输出 8.00 元
#   空闲时段 = 高峰 × 0.5；高峰 = 北京时间周一至周五 9:00-12:00、14:00-18:00
#   （中国法定节假日未建模，一年约 10 天会算错，误差几个百分点）
billing:
  deepseek:
    model: "deepseek-flash"
    cache_hit: 0.04
    cache_miss: 2.0
    output: 8.0
    offpeak_factor: 0.5
    peak_hours: [9, 10, 11, 14, 15, 16, 17]   # 北京时间
  electricity:
    # 成都：居民一档 0.5224，一般工商业单一制平段 ~0.6125（国网四川 2026-10）。
    # 只统计显卡自身功耗（NVML），不含 CPU / 电源损耗 / 机箱风扇。
    cny_per_kwh: 0.6

gpu:
  # Use nvidia-smi CSV if NVML cannot be loaded.
  fallback_csv: true

# Docker management, deliberately scoped to the vLLM engine only.
# Reads enumerate everything (so we refuse to delete an image some other
# project uses); writes can only touch the resources below.
docker:
  enabled: true
  image_repos: ["vllm/vllm-openai"]     # add mirrors here, e.g. "dockerproxy.net/vllm/vllm-openai"
  containers: []                        # empty → engine.container_names.vllm
  pull_timeout_s: 3600
