# ---------------------------------------------------------------------------
# llm-monitor configuration
#
# Paths are resolved relative to THIS file's directory.
# Every key can be overridden with MONITOR_<SECTION>_<KEY> env vars, e.g.
#   MONITOR_SERVER_UI_PORT=9010  MONITOR_SERVER_GATEWAY_PORT=8010
# ---------------------------------------------------------------------------

paths:
  run_llm: "../run_llm.sh"     # the existing launcher (engines are started through it)
  run_dir: "../run"            # run_llm.sh RUN_DIR (pid files + engine logs)
  state_dir: "./state"         # monitor's own sqlite db / start logs

server:
  # Control plane: REST + WebSocket + the web UI.
  ui_host: "0.0.0.0"
  ui_port: 9000
  # Data plane: the OpenAI-compatible gateway every client talks to.
  gateway_host: "0.0.0.0"
  gateway_port: 8000
  # The engine binds here (loopback only, so nobody can bypass the tap).
  engine_port: 8001
  # Optional shared secret for the control API ("" = no auth, trusted LAN only).
  auth_token: ""

engine:
  default: "vllm"
  # Where the engine binds. Loopback keeps every request on the data path
  # (nobody can bypass the tap). Set 0.0.0.0 only as an operational escape hatch.
  bind_host: "127.0.0.1"
  container_names:
    vllm: "vllm-qwen38"
    ninfer: "ninfer-qwen38"
  profiles: ["stage1", "mtp", "dflash", "dflash2", "kv2", "kv3"]
  default_ctx:
    vllm: "128k"
    ninfer: "256k"
  # P2b: build the launch command natively from engines/*.yaml instead of
  # shelling out to ../run_llm.sh. Set false (or MONITOR_ENGINE_LAUNCHER=0) to
  # fall back to the old path.
  launcher: true
  stop_grace_s: 25
  health_timeout_s: 1800
  health_poll_s: 2.0
  # Ask run_llm.sh to start NInfer with the full-precision JSONL request log.
  ninfer_jsonl: true
  ninfer_jsonl_path: "../run/ninfer-requests.jsonl"
  ninfer_stats_interval_ms: 1000
  # Extra env passed to run_llm.sh (e.g. API_KEY, GPU_MEM_UTIL).
  extra_env: {}

gateway:
  # Inject `stream_options.include_usage` into streaming chat requests so every
  # stream ends with exact usage. Some naive clients crash on the extra chunk
  # with `choices: []`; leave false if you have such a client.
  force_usage_chunk: false
  # Hard cap for buffering a request/response body for the tap (bytes).
  max_capture_bytes: 8388608
  # Upstream connect timeout (seconds); generation itself is never timed out.
  connect_timeout_s: 10

collect:
  metrics_interval_s: 2.0
  gpu_interval_s: 1.0
  runtime_interval_s: 3.0
  # Window used to turn engine counters into tok/s.
  rate_window_s: 10.0

storage:
  db: "./state/monitor.db"
  # In-memory time-series ring (1 sample/s).
  ring_seconds: 7200
  # Prompt/response TEXT is kept only for the newest N requests (0 = keep none).
  text_keep: 200
  # Per-request text cap (bytes) for the tap.
  text_cap_bytes: 2097152
  # Metadata retention.
  retention_days: 30

gpu:
  # Use nvidia-smi CSV if NVML cannot be loaded.
  fallback_csv: true

# Docker management, deliberately scoped to the vLLM engine only.
# Reads enumerate everything (so we refuse to delete an image some other
# project uses); writes can only touch the resources below.
docker:
  enabled: true
  image_repos: ["vllm/vllm-openai"]     # add mirrors here, e.g. "dockerproxy.net/vllm/vllm-openai"
  containers: []                        # empty → engine.container_names.vllm
  pull_timeout_s: 3600
