# Declarative description of the vLLM engine.
#
# Every value below is knowledge extracted from ../run_llm.sh. The parity tool
# (tools/parity.py) diffs the resolved argv against `run_llm.sh --dry-run`
# across the profile/ctx matrix, so this file must stay byte-exact until
# run_llm.sh is retired.
#
# Templating: ${var} is substituted strictly (unknown var = error).

name: vllm
kind: container

container_name: vllm-qwen38
image: "vllm/vllm-openai:cu130-sm120"
default_ctx: "128k"
model_max_context: 262144
served_model_name: "qwen3.8-27b"

# Variables that carry a human-friendly size ("12G") and must reach the argv as
# plain bytes. launcher.resolve() normalizes them via parse_size().
size_vars: [cpu_bytes_to_use]

models:
  # Same resolution order as run_llm.sh: first candidate containing <dir>/config.json
  dir_candidates:
    # The model volume first: /mnt/models/hf is where checkpoints live on this
    # box (vg_ssd1-lv_models). Whatever candidate matches becomes the container's
    # /models, so adding a model = unpacking it under /mnt/models/hf.
    - "/mnt/models/hf"
    - "${project_dir}/models"
    - "/home/eedy/workspace/git/vllm/models"
  dir_name: "Qwen3.8-27B-FP8"
  dflash_dir_name: "Qwen3.8-27B-DFlash2"

defaults:
  # 48 of 64 layers are linear attention: each decode sequence pins one Mamba
  # cache block. At gpu_mem_util 0.92 only ~250 blocks exist, so vLLM's default
  # max_num_seqs=256 makes CUDA-graph capture fail. Keep this below the blocks.
  # 2026-10-22: 192 was wildly out of line with the real budget (128k ctx =
  # 81 blocks/request → ~186 blocks ≈ 2.3 concurrent); admitting 192 sequences
  # just made the KV tier thrash. Measured on 6×56k concurrent (128k ctx):
  #   seqs=4  -> 38 tok/s agg, TTFT 19-25 s
  #   seqs=8  -> 62 tok/s agg, TTFT 5-13 s      ← best
  #   seqs=16 -> 12 tok/s agg (thrash)
  # Short-request traffic (8×2k) still gets 244 tok/s at 8.
  max_num_seqs: "8"
  # 2048 → 8192 (2026-10-22): at 2048 a handful of long prefills eat the whole
  # per-step budget and decode collapses to ~6 tok/s (measured 6×56k concurrent).
  # 8192 measured prefill +2~4 %, KV −1.5 %; 32768 startup-OOMs on this card.
  max_num_batched_tokens: "8192"
  gpu_mem_util: "0.92"
  # fp8 halves the KV footprint; 256k fits (366,097 KV tokens = 1.40x).
  kv_cache_dtype: "fp8"
  mamba_ssm_cache_dtype: ""
  reasoning_parser: "qwen3"
  tool_call_parser: "qwen3_coder"
  log_level: "INFO"
  hf_hub_offline: "1"
  restart_policy: "no"
  privileged: "0"
  cors: "1"
  spec_metrics: "summary"
  kv_offload_gb: "4"
  # Tier-2 (CPU RAM) budget of the 3-tier KV offload layer, in bytes once
  # normalized by size_vars. Overridden by config.yaml → kvcache.cpu_bytes_to_use.
  cpu_bytes_to_use: "12G"
  # Layer switch for the offload layer below (1 = append --kv-transfer-config).
  # The monitor sets it from config.yaml → kvcache.enabled.
  offload_enabled: "0"
  # Whether that layer also carries the disk (fs) secondary tier. 1 = GPU → CPU
  # → 磁盘, 0 = GPU → CPU only. The monitor sets it from config.yaml →
  # kvcache.disk_enabled, and the UI can override it per launch.
  # Why it is a switch at all: vLLM 0.31's FileSystemTierManager has no capacity
  # limit and no eviction, so it keeps writing until the syscall fails with
  # ENOSPC (measured: partition 100 % full, 2959 cascade failures, disk hit
  # rate 10 %). No disk tier = nothing to fill, at the cost of losing prefix
  # reuse across engine restarts.
  kv_disk_enabled: "1"
  # Disk-tier budget in GiB (0 = use the whole filesystem). vLLM's fs tier has
  # no capacity limit of its own, so the monitor enforces this by reclaiming
  # the oldest block files (see monitor/kvcache.py).
  # NOT a UI option on purpose: it is monitor-side policy, it never reaches the
  # engine argv, and exposing it next to real vLLM flags read as if it did.
  # Set config.yaml → kvcache.disk_limit_gb instead (controller.kvcache_vars()).
  kv_disk_limit_gb: "0"
  spec_tokens:
    stage1: null
    mtp: "3"
    dflash: "7"
  cache_dir: "${project_dir}/vllm_cache_nvidia"
  kvoffload_dir: "${home}/kvoffload"

container:
  flags:
    - run
    - "-d"
    - "--name"
    - "${container_name}"
    - "-t"
    - "--restart"
    - "${restart_policy}"
    - "--network"
    - "host"
    - "--ipc=host"
    - "--security-opt"
    - "seccomp=unconfined"
    - "--ulimit"
    - "memlock=-1"
    - "--ulimit"
    - "stack=67108864"
  device: "nvidia.com/gpu=all"
  privileged_flag: "--privileged"
  labels:
    # lets the monitor recognise containers it created, even after a rename
    llm-monitor.managed: "1"
    llm-monitor.engine: "vllm"
  mounts:
    - "${models_dir}:/models:ro"
    - "${cache_dir}:/root/.cache/vllm"
  env:
    VLLM_CACHE_ROOT: "/root/.cache/vllm"
    VLLM_LOGGING_LEVEL: "${log_level}"
    HF_HUB_OFFLINE: "${hf_hub_offline}"
    TRANSFORMERS_OFFLINE: "${hf_hub_offline}"

engine_args:
  - "--model"
  - "/models/${model_dir_name}"
  - "--served-model-name"
  - "${served_model_name}"
  - "--host"
  - "${host}"
  - "--port"
  - "${port}"
  - "--max-model-len"
  - "${ctx}"
  - "--gpu-memory-utilization"
  - "${gpu_mem_util}"
  - "--max-num-seqs"
  - "${max_num_seqs}"
  # Per-step token budget = the chunked-prefill chunk size. Kept at vLLM's own
  # default (2048): measured on this GPU (48 GB, 250 W cap) the gains are small
  # and the trade-off is real —
  #   2048 -> cold 127k prefill 51.4 s | 60 %-cache case 29.6 s
  #   8192 -> 50.2 s (-2.3 %)          | 28.3 s (-4.4 %)   KV -1.5 %, disk IO +5x
  #   32768 -> startup OOM (needs ~576 MiB more than the card has left).
  # Raise it per-launch from the engine page when prefill latency matters more
  # than decode ITL.
  - "--max-num-batched-tokens"
  - "${max_num_batched_tokens}"
  - "--enable-prefix-caching"
  # 每个响应要带 usage.prompt_tokens_details.cached_tokens：vLLM 默认不带，
  # 于是 tap 记不到命中数，请求历史里「缓存」列永远是 0（源码 anthropic/serving.py
  # 的注释确认了 "flag off → 字段省略" 的行为）。总览的命中率走 /metrics 不受影响。
  - "--enable-prompt-tokens-details"

conditional_args:
  - when: {reasoning_parser: {truthy: true}}
    args: ["--reasoning-parser", "${reasoning_parser}"]
  - when: {tool_call_parser: {truthy: true}}
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "${tool_call_parser}"]
  - when: {api_key: {truthy: true}}
    args: ["--api-key", "${api_key}"]
  - when: {cors: {falsy: true}}
    args: ["--allowed-origins", "[]"]
  - when: {kv_cache_dtype: {ne: "auto"}}
    args: ["--kv-cache-dtype", "${kv_cache_dtype}"]
  - when: {mamba_ssm_cache_dtype: {truthy: true}}
    args: ["--mamba-ssm-cache-dtype", "${mamba_ssm_cache_dtype}"]

profiles:
  stage1: {}
  mtp:
    args:
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":${spec_tokens}}'
      - "--per-request-spec-decode-metrics"
      - "${spec_metrics}"
  dflash:
    args:
      - "--speculative-config"
      - '{"method":"dflash","model":"/models/${dflash_dir_name}","num_speculative_tokens":${spec_tokens}}'
      - "--per-request-spec-decode-metrics"
      - "${spec_metrics}"
    requires:
      - "${models_dir}/${dflash_dir_name}/config.json"
  kv2:
    args:
      - "--kv-offloading-size"
      - "${kv_offload_gb}"
      - "--kv-offloading-backend"
      - "native"
  kv3:
    args:
      - "--kv-transfer-config"
      - |-
        {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{
          "spec_name":"TieringOffloadingSpec",
          "cpu_bytes_to_use":${cpu_bytes_to_use},
          "eviction_policy":"arc",
          "secondary_tiers":[{"type":"fs","root_dir":"/kvoffload/${model_dir_name}",
            "n_read_threads":16,"n_write_threads":8,"locality":"LOCAL",
            "backpressure":{"backpressure_cls":"EMABackpressureDetector",
              "policy_cls":"DropStorePolicy"}}]}}
    mounts:
      - "${kvoffload_dir}:/kvoffload"

# ── Layers ───────────────────────────────────────────────────────────────────
# Orthogonal to `profiles`: a layer appends args/mounts whenever its `when`
# holds, so a feature can be combined with any profile (mtp, dflash, …) instead
# of living in a mutually-exclusive profile. The legacy kv2/kv3 profiles stay
# for byte-compatibility with run_llm.sh, hence the not_in guard below.
layers:
  - when:
      offload_enabled: {truthy: true}
      kv_disk_enabled: {truthy: true}
      profile: {not_in: [kv2, kv3]}
    mounts:
      - "${kvoffload_dir}:/kvoffload"
    args:
      # Hybrid (Mamba/linear-attention) models: without this the offload tiers
      # *find* a cached prefix but vLLM cannot restore the recurrent state, so
      # it silently recomputes everything (measured: 49.7 s wasted per request
      # on a 120k prompt with a 72k shared prefix). With it, the tier hit is
      # honoured: 49.7 s -> 27.1 s, 58.6 % hit rate.
      - "--enable-mamba-shared-prefix-checkpoint"
      - "--kv-transfer-config"
      - |-
        {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{
          "spec_name":"TieringOffloadingSpec",
          "cpu_bytes_to_use":${cpu_bytes_to_use},
          "eviction_policy":"arc",
          "secondary_tiers":[{"type":"fs","root_dir":"/kvoffload/${model_dir_name}",
            "n_read_threads":16,"n_write_threads":8,"locality":"LOCAL",
            "backpressure":{"backpressure_cls":"EMABackpressureDetector",
              "policy_cls":"DropStorePolicy"}}]}}

  # Same layer without the disk tier: the CPU primary tier keeps serving prefix
  # hits, and no fs tier exists to fill a partition or to reclaim from. The
  # kvoffload directory is not mounted either, so nothing can be written there.
  - when:
      offload_enabled: {truthy: true}
      kv_disk_enabled: {falsy: true}
      profile: {not_in: [kv2, kv3]}
    args:
      - "--enable-mamba-shared-prefix-checkpoint"
      - "--kv-transfer-config"
      - |-
        {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{
          "spec_name":"TieringOffloadingSpec",
          "cpu_bytes_to_use":${cpu_bytes_to_use},
          "eviction_policy":"arc",
          "secondary_tiers":[]}}

# Fields rendered by the web UI for THIS engine. `key` is the launcher variable
# name, so adding a field never needs UI code.
options:
  # Which checkpoint to serve. The choices are filled at /api/engines time from
  # the directories that actually exist under models/ (see
  # launcher.model_dirs), so a half-downloaded dir never shows up.
  - key: model_dir_name
    label: "模型"
    type: enum
    choices: []
    hint: "models/ 下的目录（必须含 config.json）；换模型后确认它有 MTP 层，否则 profile mtp 会启动失败"
  - key: kv_cache_dtype
    label: "KV 类型"
    type: enum
    choices: [fp8, auto, fp8_e4m3, fp8_e5m2]
    choice_labels:
      fp8: "fp8（默认）"
      auto: "auto = bf16"
      fp8_e4m3: "fp8_e4m3"
      fp8_e5m2: "fp8_e5m2"
    default: fp8
    hint: "fp8 让 256k 放得下；auto(bf16) 在 256k 会 OOM"
  - key: max_num_seqs
    label: "max num seqs"
    type: int
    default: 8
    hint: "并发序列上限。192 对 128k 上下文完全脱节；实测 6×56k 并发 seqs=8 最快（62 tok/s），16 会抖动"
  - key: max_num_batched_tokens
    label: "prefill chunk (tokens/step)"
    type: int
    default: 8192
    hint: "每步 token 预算 = chunk 大小。2048 时长 prefill 会饿死 decode（6×56k 并发实测只剩 6 tok/s）；8192 实测 prefill 快 2~4%；32768 在本卡会 OOM"
  - key: gpu_mem_util
    label: "GPU 显存占比"
    type: float
    default: 0.92
    step: 0.01
  - key: spec_tokens
    label: "投机 token 数"
    type: int
    default: null
    placeholder: "profile 默认（mtp 3 / dflash 7）"
    show_if: {profiles: [mtp, dflash]}
  - key: reasoning_parser
    label: "reasoning parser"
    type: enum
    choices: [qwen3, ""]
    choice_labels: {qwen3: "qwen3（拆分 thinking）", "": "关闭"}
    default: qwen3
  - key: tool_call_parser
    label: "tool-call parser"
    type: enum
    choices: [qwen3_coder, ""]
    choice_labels: {qwen3_coder: "qwen3_coder", "": "关闭"}
    default: qwen3_coder
  - key: mamba_ssm_cache_dtype
    label: "Mamba 状态精度"
    type: enum
    choices: ["", bfloat16, float32]
    choice_labels: {"": "默认 (float32)", bfloat16: "bfloat16（省一半）", float32: "float32"}
    default: ""
    hint: "bfloat16 可把 Mamba block 数翻倍"
  - key: cors
    label: "CORS"
    type: bool
    default: "1"
  - key: offload_enabled
    label: "KV offload（三级缓存）"
    type: bool
    default: "0"
    hint: "开 = GPU → CPU 内存 → 磁盘；默认值来自 config.yaml → kvcache.enabled"
  - key: kv_disk_enabled
    label: "磁盘层"
    type: bool
    default: "1"
    show_if: {offload_enabled: [true, "1", "on"]}
    hint: "开 = 多一级磁盘 cache（vLLM fs 层，引擎重启后仍能复用前缀）；关 = 只保留 CPU 内存层。vLLM 的 fs 层没有淘汰，写满会一路 ENOSPC；改动在下次启动引擎时生效"
  - key: cpu_bytes_to_use
    label: "内存 cache"
    type: size
    default: "12G"
    placeholder: "12G / 8192m / 12884901888"
    show_if: {offload_enabled: [true, "1", "on"]}
    hint: "第 2 级（CPU 主层）预算，默认 12 GiB"
  - key: kvoffload_dir
    label: "磁盘 cache 目录"
    type: path
    placeholder: "/mnt/kvcache/kvoffload"
    show_if: {offload_enabled: [true, "1", "on"], kv_disk_enabled: [true, "1", "on"]}
    hint: "宿主机路径，容器内挂到 /kvoffload；默认来自 config.yaml → kvcache.disk_dir"
  - key: api_key
    label: "API Key"
    type: password
    default: ""
    hint: "引擎鉴权 + 网关注入；长期使用请写进 config.yaml → engine.extra_env.API_KEY"

# Log lines used to turn "starting…" into a real progress display.
# index in this list == progress; `error: true` marks a failure marker.
startup:
  - {match: "Initializing a V1 LLM engine", phase: "初始化引擎"}
  - {match: "Loading model from scratch|Loading weights took|Model loading took", phase: "加载权重"}
  - {match: "profiling/warmup run|kernel warmup starting|Warming up", phase: "预热"}
  - {match: "Graph capturing finished|Capturing CUDA graph", phase: "捕获 CUDA Graph"}
  - {match: "init engine .* took|Starting vLLM API server|Waiting for application startup", phase: "启动 API"}
  - {match: "Application startup complete|Uvicorn running", phase: "就绪"}
  - {match: "CUDA out of memory|RuntimeError|ValueError|Traceback", phase: "错误", error: true}

# Profiles this engine refuses (with the reason shown to the user).
unsupported_profiles:
  dflash2: "Profile 'dflash2' is NInfer-only; vLLM uses --profile dflash here."
